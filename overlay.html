<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Onetricks Scoreboard Gold Overlay</title>
  <!-- Google Fonts Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Outfit:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="overlay.css">
  <style>
    /* ── Preview / Calibration Mode ── */
    #preview-hint-wrap {
      display: none;
      position: fixed;
      top: 16px;
      right: 20px;
      z-index: 99999;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      animation: fadeIn 0.2s ease-out forwards;
    }
    body.preview-mode #preview-hint-wrap {
      display: flex;
    }
    #preview-hint {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: #c89b3c;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      background: rgba(10, 12, 16, 0.88);
      border: 1px solid rgba(200, 155, 60, 0.35);
      padding: 6px 14px;
      border-radius: 6px;
      text-align: right;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      pointer-events: none;
    }
    #preview-done-btn {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 800;
      color: #0a0c10;
      background: linear-gradient(135deg, #f0c060, #c89b3c);
      border: none;
      padding: 7px 18px;
      border-radius: 6px;
      cursor: pointer;
      pointer-events: auto;
      box-shadow: 0 4px 16px rgba(200, 155, 60, 0.5);
      letter-spacing: 0.4px;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    #preview-done-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(200, 155, 60, 0.7);
    }
    #preview-done-btn:active {
      transform: translateY(1px);
      box-shadow: 0 2px 8px rgba(200, 155, 60, 0.4);
    }
    /* In preview mode, draggable elements show move cursor */
    body.preview-mode .team-comparison-header,
    body.preview-mode .matchup-indicator,
    body.preview-mode .matchup-row {
      pointer-events: auto !important;
      cursor: move !important;
    }
  </style>
</head>
<body>
  <!-- Preview Mode: floating hint + done button (hidden by default) -->
  <div id="preview-hint-wrap">
    <span id="preview-hint">Arrastra los elementos · ESC para salir</span>
    <button id="preview-done-btn">✓ Listo</button>
  </div>

  <!-- Highly Compact Scoreboard Header Gold Widget -->
  <div class="team-comparison-header" id="team-header">
    <div class="team-info blue-team">
      <span class="gold-icon">🪙</span>
      <span class="team-gold" id="blue-gold-lbl">0</span>
    </div>
    
    <div class="header-difference-badge" id="header-diff-badge">
      <span id="header-diff-arrow" class="diff-arrow"></span>
      <span id="header-diff-val" class="diff-val">0</span>
    </div>
    
    <div class="team-info red-team">
      <span class="team-gold" id="red-gold-lbl">0</span>
      <span class="gold-icon">🪙</span>
    </div>
  </div>

  <!-- Vertical Matchups Column (rows are individually position:fixed in CSS) -->
  <div class="matchups-vertical-column" id="matchups-column">
    <div class="matchup-row" id="matchup-row-0" style="display: none;">
      <div class="matchup-indicator even" id="matchup-indicator-0">
        <div class="indicator-diamond">
          <span class="indicator-arrow" id="matchup-arrow-0">=</span>
        </div>
        <div class="indicator-value" id="matchup-val-0"></div>
      </div>
    </div>
    <div class="matchup-row" id="matchup-row-1" style="display: none;">
      <div class="matchup-indicator even" id="matchup-indicator-1">
        <div class="indicator-diamond">
          <span class="indicator-arrow" id="matchup-arrow-1">=</span>
        </div>
        <div class="indicator-value" id="matchup-val-1"></div>
      </div>
    </div>
    <div class="matchup-row" id="matchup-row-2" style="display: none;">
      <div class="matchup-indicator even" id="matchup-indicator-2">
        <div class="indicator-diamond">
          <span class="indicator-arrow" id="matchup-arrow-2">=</span>
        </div>
        <div class="indicator-value" id="matchup-val-2"></div>
      </div>
    </div>
    <div class="matchup-row" id="matchup-row-3" style="display: none;">
      <div class="matchup-indicator even" id="matchup-indicator-3">
        <div class="indicator-diamond">
          <span class="indicator-arrow" id="matchup-arrow-3">=</span>
        </div>
        <div class="indicator-value" id="matchup-val-3"></div>
      </div>
    </div>
    <div class="matchup-row" id="matchup-row-4" style="display: none;">
      <div class="matchup-indicator even" id="matchup-indicator-4">
        <div class="indicator-diamond">
          <span class="indicator-arrow" id="matchup-arrow-4">=</span>
        </div>
        <div class="indicator-value" id="matchup-val-4"></div>
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const blueGoldLbl = document.getElementById('blue-gold-lbl');
    const redGoldLbl  = document.getElementById('red-gold-lbl');
    const headerDiffBadge = document.getElementById('header-diff-badge');
    const headerDiffArrow = document.getElementById('header-diff-arrow');
    const headerDiffVal   = document.getElementById('header-diff-val');

    const formatGold = (amount) => {
      if (amount >= 1000) return (amount / 1000).toFixed(1) + 'k';
      return amount;
    };

    // ── Gold data update ──
    ipcRenderer.on('update-gold', (event, data) => {
      if (!data) return;

      blueGoldLbl.textContent = data.alliesTotalGold;
      redGoldLbl.textContent  = data.enemiesTotalGold;

      const diff = data.teamGoldDifference;
      if (diff === 0) {
        headerDiffVal.textContent   = '0';
        headerDiffArrow.textContent = '=';
        headerDiffBadge.className   = 'header-difference-badge even';
      } else if (diff > 0) {
        headerDiffVal.textContent   = diff;
        headerDiffArrow.textContent = '◀';
        headerDiffBadge.className   = 'header-difference-badge allies-ahead';
      } else {
        headerDiffVal.textContent   = Math.abs(diff);
        headerDiffArrow.textContent = '▶';
        headerDiffBadge.className   = 'header-difference-badge enemies-ahead';
      }

      if (data.matchups && data.matchups.length > 0) {
        data.matchups.forEach((m, idx) => {
          if (idx >= 5) return;
          const row       = document.getElementById('matchup-row-' + idx);
          const indicator = document.getElementById('matchup-indicator-' + idx);
          const arrow     = document.getElementById('matchup-arrow-' + idx);
          const val       = document.getElementById('matchup-val-' + idx);
          if (row && indicator && arrow && val) {
            const diffVal = m.difference;
            let diffClass  = 'even', arrowSymbol = '=', diffText = '';
            if (diffVal > 0) {
              diffClass = 'ahead'; arrowSymbol = '◀'; diffText = formatGold(diffVal);
            } else if (diffVal < 0) {
              diffClass = 'behind'; arrowSymbol = '▶'; diffText = formatGold(Math.abs(diffVal));
            }
            indicator.className    = `matchup-indicator ${diffClass}`;
            arrow.textContent      = arrowSymbol;
            val.textContent        = diffVal !== 0 ? diffText : '';
            row.style.display      = 'flex';
          }
        });
        for (let i = data.matchups.length; i < 5; i++) {
          const row = document.getElementById('matchup-row-' + i);
          if (row) row.style.display = 'none';
        }
      } else {
        for (let i = 0; i < 5; i++) {
          const row = document.getElementById('matchup-row-' + i);
          if (row) row.style.display = 'none';
        }
      }
    });

    // ── State ──
    const teamHeader = document.getElementById('team-header');
    let isPreviewMode   = false;
    let isDraggingHeader = false;
    let rowDraggingFlags = [false, false, false, false, false];
    let rowOffsets = [{x:0,y:0},{x:0,y:0},{x:0,y:0},{x:0,y:0},{x:0,y:0}];
    let headerX = 0, headerY = 0;

    // ── Direct CSS var helpers (instant visual update, no IPC) ──
    function applyHeaderOffset(x, y) {
      headerX = x; headerY = y;
      document.documentElement.style.setProperty('--header-offset-x', x + 'px');
      document.documentElement.style.setProperty('--header-offset-y', y + 'px');
    }
    function applyRowOffset(i, x, y) {
      rowOffsets[i].x = x; rowOffsets[i].y = y;
      document.documentElement.style.setProperty('--row' + i + '-offset-x', x + 'px');
      document.documentElement.style.setProperty('--row' + i + '-offset-y', y + 'px');
    }

    // ── Receive initial/updated offsets from main process ──
    ipcRenderer.on('update-offsets', (event, offsets) => {
      if (!offsets) return;
      applyHeaderOffset(
        offsets.headerX !== undefined ? offsets.headerX : (offsets.globalX || 0),
        offsets.headerY !== undefined ? offsets.headerY : (offsets.globalY || 0)
      );
      for (let i = 0; i < 5; i++) {
        applyRowOffset(
          i,
          offsets['row' + i + 'X'] !== undefined ? offsets['row' + i + 'X'] : (offsets.globalX || 0),
          offsets['row' + i + 'Y'] !== undefined ? offsets['row' + i + 'Y'] : (offsets.globalY || 0)
        );
      }
    });

    // ── Click-through toggle (normal game mode only) ──
    teamHeader.addEventListener('mouseenter', () => {
      if (!isPreviewMode) ipcRenderer.send('set-click-through', false);
    });
    teamHeader.addEventListener('mouseleave', () => {
      if (!isPreviewMode && !isDraggingHeader) ipcRenderer.send('set-click-through', true);
    });

    ipcRenderer.on('select-element', (event, elementId) => {
      teamHeader.classList.remove('selected');
      for (let i = 0; i < 5; i++) {
        const ind = document.getElementById('matchup-indicator-' + i);
        if (ind) ind.classList.remove('selected');
      }
      if (elementId === 'header') {
        teamHeader.classList.add('selected');
      } else if (elementId && elementId.startsWith('row')) {
        const ind = document.getElementById('matchup-indicator-' + elementId.substring(3));
        if (ind) ind.classList.add('selected');
      }
    });

    // ── Drag system: visual update is LOCAL, IPC only on mouseup to persist ──
    function setupDraggable(element, saveType, getOffsetX, getOffsetY, setOffsetXY, setDraggingFlag) {
      let isDragging = false, startMX = 0, startMY = 0, startOX = 0, startOY = 0;

      element.addEventListener('mousedown', (e) => {
        isDragging = true;
        setDraggingFlag(true);
        ipcRenderer.send('dragging-state-change', true); // Let main process ignore scoreboard DRAG deltas
        startMX = e.clientX; startMY = e.clientY;
        startOX = getOffsetX(); startOY = getOffsetY();
        e.preventDefault();
        e.stopPropagation();
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        setOffsetXY(startOX + (e.clientX - startMX), startOY + (e.clientY - startMY));
      });

      window.addEventListener('mouseup', (e) => {
        if (!isDragging) return;
        isDragging = false;
        setDraggingFlag(false);
        ipcRenderer.send('dragging-state-change', false); // Allow scoreboard DRAG deltas again
        // Persist final position to disk via IPC
        ipcRenderer.send('save-element-offset', { type: saveType, x: getOffsetX(), y: getOffsetY() });
        // In normal mode: restore click-through if mouse left the element
        if (!isPreviewMode) {
          const r = element.getBoundingClientRect();
          const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
          if (!inside) ipcRenderer.send('set-click-through', true);
        }
      });
    }

    setupDraggable(
      teamHeader, 'header',
      () => headerX, () => headerY,
      (x, y) => applyHeaderOffset(x, y),
      (v) => { isDraggingHeader = v; }
    );

    for (let i = 0; i < 5; i++) {
      const indicator = document.getElementById('matchup-indicator-' + i);
      if (!indicator) continue;
      const idx = i;
      setupDraggable(
        indicator, 'row' + idx,
        () => rowOffsets[idx].x, () => rowOffsets[idx].y,
        (x, y) => applyRowOffset(idx, x, y),
        (v) => { rowDraggingFlags[idx] = v; }
      );
      indicator.addEventListener('mouseenter', () => {
        if (!isPreviewMode) ipcRenderer.send('set-click-through', false);
      });
      indicator.addEventListener('mouseleave', () => {
        if (!isPreviewMode && !rowDraggingFlags[idx]) ipcRenderer.send('set-click-through', true);
      });
    }

    // ── Preview / Calibration Mode ──
    const endPreviewFn = () => ipcRenderer.send('end-preview');

    document.getElementById('preview-done-btn').addEventListener('click', endPreviewFn);

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && isPreviewMode) endPreviewFn();
    });

    ipcRenderer.on('start-preview', () => {
      isPreviewMode = true;
      document.body.classList.add('preview-mode');
    });

    ipcRenderer.on('end-preview', () => {
      isPreviewMode = false;
      document.body.classList.remove('preview-mode');
    });
  </script>
</body>
</html>
